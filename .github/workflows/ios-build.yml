name: iOS simulator build

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator:
    name: Compile iOS app for simulator
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx expo lint
      - run: npx tsc --noEmit
      - run: npx expo export --platform web --output-dir /tmp/norsk-rom-web-export
      - run: npx expo export --platform ios --output-dir /tmp/norsk-rom-ios-export
      - run: npx expo prebuild --platform ios --no-install
      - run: pod install --project-directory=ios
      - run: >-
          xcodebuild
          -workspace ios/NorskRom.xcworkspace
          -scheme NorskRom
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath /tmp/norsk-rom-derived
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Launch the app in an iOS Simulator
        run: |
          simulator_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if d["isAvailable"] and "iPhone" in d["name"]))')"
          xcrun simctl boot "$simulator_id" 2>/dev/null || true
          xcrun simctl bootstatus "$simulator_id" -b
          xcrun simctl install "$simulator_id" /tmp/norsk-rom-derived/Build/Products/Release-iphonesimulator/NorskRom.app
          xcrun simctl launch "$simulator_id" no.norskrom.app
